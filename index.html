<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>İndirim Haritası</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      --bg:#f6f7f9;
      --panel:rgba(255,255,255,.94);
      --text:#101318;
      --muted:#6f7782;
      --line:#e8eaee;
      --blue:#315fbd;
      --blue2:#244c9b;
      --shadow:0 12px 35px rgba(20,30,55,.16);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    #map{position:fixed;inset:0;width:100%;height:100%;min-height:100dvh}
    @supports not (height:100dvh){#map{min-height:100vh}}
    .leaflet-control-attribution{font-size:9px!important}
    .top{
      position:fixed;z-index:1200;
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      top:max(10px,env(safe-area-inset-top));
      display:flex;align-items:center;gap:10px;pointer-events:none
    }
    .brand,.actions,.filters{pointer-events:auto}
    .brand{
      display:flex;align-items:center;gap:10px;background:var(--panel);
      border:1px solid rgba(255,255,255,.65);box-shadow:var(--shadow);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      padding:10px 13px;border-radius:16px;min-width:0
    }
    .brandmark{
      width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
      background:#fff;flex:0 0 auto;overflow:hidden;border:1px solid rgba(32,38,48,.10)
    }
    .brandmark img{
      width:100%;height:100%;object-fit:cover;display:block
    }
    .brandtext{min-width:0}
    .title{font-weight:650;font-size:11px;line-height:1.1;margin-top:4px;color:#7b8490;letter-spacing:.01em}
    .subtitle{font-size:17px;color:#202630;font-weight:900;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em;line-height:1.05}
    .actions{margin-left:auto;display:flex;gap:8px}
    .iconbtn{
      width:46px;height:46px;border:0;border-radius:15px;background:var(--panel);
      border:1px solid rgba(255,255,255,.65);box-shadow:var(--shadow);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      display:grid;place-items:center;cursor:pointer;font-size:20px
    }
    .filters{
      position:fixed;z-index:1190;
      top:calc(max(10px,env(safe-area-inset-top)) + 62px);
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      display:flex;gap:8px;overflow:auto;padding-bottom:2px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch
    }
    .filters::-webkit-scrollbar{display:none}

    .district-chip{font-weight:850}

    .chip{
      flex:0 0 auto;border:1px solid rgba(255,255,255,.75);background:var(--panel);
      box-shadow:0 8px 24px rgba(20,30,55,.11);backdrop-filter:blur(14px);
      padding:9px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer
    }
    .chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .searchbar{
      position:fixed;z-index:1300;
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      top:max(10px,env(safe-area-inset-top));
      display:none;gap:8px
    }
    .searchbar.open{display:flex}
    .searchinput{
      flex:1;min-width:0;border:1px solid var(--line);outline:none;border-radius:16px;
      background:#fff;padding:13px 15px;font-size:16px;box-shadow:var(--shadow)
    }
    .cancel{
      border:0;border-radius:16px;background:#fff;padding:0 14px;font-weight:800;box-shadow:var(--shadow)
    }
    .searchresults{
      position:fixed;z-index:1290;
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      top:calc(max(10px,env(safe-area-inset-top)) + 58px);
      display:none;background:#fff;border-radius:18px;box-shadow:var(--shadow);
      max-height:min(46vh,420px);overflow:auto;padding:8px;-webkit-overflow-scrolling:touch
    }
    .searchresults.open{display:block}
    .result{
      width:100%;border:0;background:#fff;text-align:left;display:grid;grid-template-columns:46px 1fr;gap:10px;
      padding:8px;border-radius:12px;cursor:pointer
    }
    .result:hover{background:#f5f7fb}
    .result img{width:46px;height:46px;border-radius:11px;object-fit:cover}
    .rname{font-weight:800;font-size:13px}
    .rdeal{font-size:12px;color:var(--blue2);font-weight:700;margin-top:3px}
    .photo-pin{position:relative;width:58px;height:66px}
    .photo-pin img{
      width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #fff;
      box-shadow:0 5px 18px rgba(0,0,0,.28);background:#ddd
    }
    .photo-pin:after{
      content:"";position:absolute;width:12px;height:12px;background:#fff;
      left:20px;top:45px;transform:rotate(45deg);box-shadow:3px 3px 8px rgba(0,0,0,.08)
    }
    .badge{
      position:absolute;z-index:2;right:-4px;top:-4px;background:var(--blue);color:#fff;
      border:2px solid #fff;border-radius:999px;padding:4px 6px;font-size:9px;font-weight:900;
      max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .sheet{
      position:fixed;z-index:1400;left:50%;
      bottom:max(12px,env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(120%);
      width:min(420px,calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      background:#fff;border-radius:24px;
      box-shadow:0 22px 60px rgba(20,30,55,.25);overflow:hidden;transition:.28s ease
    }
    .sheet.open{transform:translateX(-50%) translateY(0)}
    .hero{height:170px;width:100%;object-fit:cover;display:block;background:#e9ecf2}
    .sheetbody{padding:16px}
    .sheethead{display:flex;gap:12px;align-items:flex-start}
    .sheetmain{min-width:0;flex:1}
    .sname{font-size:20px;font-weight:900;line-height:1.15}
    .sdeal{color:var(--blue2);font-weight:850;margin-top:5px}
    .saddr{font-size:12px;color:var(--muted);line-height:1.4;margin-top:7px}
    .close{
      width:36px;height:36px;border:0;border-radius:50%;background:#f1f3f6;font-size:20px;cursor:pointer
    }
    .route{
      margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;text-decoration:none;background:var(--blue);color:#fff;border-radius:15px;
      padding:13px 14px;font-weight:900;text-align:center;line-height:1.2
    }
    .countpill{
      position:fixed;z-index:1150;
      right:max(12px,env(safe-area-inset-right));
      bottom:max(12px,env(safe-area-inset-bottom));
      background:rgba(255,255,255,.94);
      border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:999px;
      padding:9px 12px;font-size:12px;font-weight:800;backdrop-filter:blur(14px)
    }

    .imi-pin{
      width:30px;height:30px;border-radius:50% 50% 50% 0;
      background:#d62828;border:3px solid #fff;
      transform:rotate(-45deg);
      box-shadow:0 5px 16px rgba(0,0,0,.28);
      position:relative;
    }
    .imi-pin:after{
      content:"";position:absolute;width:8px;height:8px;border-radius:50%;
      background:#fff;left:8px;top:8px;
    }
    .imi-label{
      position:absolute;left:21px;top:-8px;transform:rotate(45deg);
      background:#fff;color:#b91c1c;border:1px solid rgba(185,28,28,.2);
      padding:4px 7px;border-radius:8px;font-size:10px;font-weight:900;
      white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.12);
    }

    @media (max-width:420px){
      .brand{padding:8px 10px;border-radius:14px;max-width:calc(100% - 58px)}
      .brandmark{width:34px;height:34px}
      .title{font-size:10px}
      .subtitle{font-size:15px}
      .iconbtn{width:42px;height:42px;border-radius:14px}
      .filters{top:calc(max(10px,env(safe-area-inset-top)) + 56px)}
      .chip{padding:8px 10px;font-size:11px}
      .hero{height:145px}
      .sheetbody{padding:14px}
      .sname{font-size:18px}
      .route{padding:12px}
    }

    @media (min-width:421px) and (max-width:899px){
      .brand{max-width:min(520px,calc(100% - 64px))}
      .sheet{width:min(460px,calc(100% - 32px))}
    }

    @media (min-width:900px){
      .sheet{
        left:auto;right:max(18px,env(safe-area-inset-right));
        bottom:max(18px,env(safe-area-inset-bottom));
        transform:translateX(0) translateY(120%);width:380px
      }
      .sheet.open{transform:translateX(0) translateY(0)}
      .filters{right:auto;max-width:70vw}
      .top{right:max(18px,env(safe-area-inset-right))}
      .brand{max-width:480px}
    }

    @media (orientation:landscape) and (max-height:560px){
      .filters{top:calc(max(8px,env(safe-area-inset-top)) + 52px)}
      .brand{padding:7px 10px}
      .brandmark{width:30px;height:30px}
      .title{font-size:10px}
      .subtitle{font-size:15px}
      .hero{height:120px}
      .sheet{max-height:86vh;overflow:auto}
    }
  </style>
</head>

        <strong style="font-size:15px">Liceo Italiano I.M.I.</strong><br>
        <span style="font-size:12px;color:#667085">Özel İtalyan Lisesi</span><br>
        <span style="font-size:12px">Tomtom Kaptan Sokak No:3, Beyoğlu</span><br>
        <a href="https://www.google.com/maps/dir/?api=1&destination=41.029886,28.978557"
           target="_blank" rel="noopener"
           style="display:inline-block;margin-top:8px;font-weight:800;color:#b91c1c;text-decoration:none">
          Google Maps'te Yol Tarifi →
        </a>
      </div>
    `);

    let activeFilter='all';
    const markers=new Map();
    const geocoded=new Map();

    function routeUrl(p){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.q); }
    function badgeText(p){
      const m=p.deal.match(/%\d+/);
      if(m) return m[0];
      if(p.name==="Chuck Burger") return "300₺";
      return "Fırsat";
    }
    function iconFor(p){
      return L.divIcon({
        className:'',
        iconSize:[60,68],iconAnchor:[29,60],
        html:`<div class="photo-pin"><img src="${photos[p.pic]}" alt="" loading="lazy" decoding="async"><span class="badge">${badgeText(p)}</span></div>`
      });
    }
    function showPlace(p){
      document.getElementById('sheetImg').src=photos[p.pic];
      document.getElementById('sheetImg').alt=p.name;
      document.getElementById('sheetName').textContent=p.name;
      document.getElementById('sheetDeal').textContent=p.deal;
      const g=geocoded.get(p.name);
      document.getElementById('sheetAddr').textContent=g?.display || p.q;
      document.getElementById('routeBtn').href=routeUrl(p);
      document.getElementById('sheet').classList.add('open');
      const m=markers.get(p.name);
      if(m) map.panTo(m.getLatLng(),{animate:true});
    }
    function hideSheet(){ document.getElementById('sheet').classList.remove('open'); }

    const CACHE_KEY='indirimHaritasiCoords_v3';

    function readCache(){
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
      catch(e){ return {}; }
    }
    function writeCache(cache){
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e){}
    }

    async function geocode(q){
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),4500);
      try{
        const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tr&q='+encodeURIComponent(q);
        const r=await fetch(u,{headers:{Accept:'application/json'},signal:controller.signal});
        if(!r.ok) return null;
        const d=await r.json();
        if(!d.length) return null;
        return {lat:+d[0].lat,lon:+d[0].lon,display:d[0].display_name};
      }catch(e){ return null; }
      finally{ clearTimeout(timer); }
    }

    function passes(p){
      if(activeFilter==='beyoglu') return p.district==='beyoglu';
      if(activeFilter==='besiktas') return p.district==='besiktas';
      if(activeFilter==='kadikoy') return p.district==='kadikoy';
      if(activeFilter==='20') return (p.pct||0)>=20;
      if(activeFilter==='food') return p.type==='food';
      if(activeFilter==='other') return p.type==='other';
      return true;
    }

    function kmDistance(a,b){
      const R=6371;
      const toRad=x=>x*Math.PI/180;
      const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
      const la1=toRad(a.lat), la2=toRad(b.lat);
      const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(h));
    }

    // Find the densest local cluster, rather than simply the geometric district center.
    function districtHotspot(district){
      const pts=places
        .filter(p=>p.district===district)
        .map(p=>{
          const m=markers.get(p.name);
          const ll=m ? m.getLatLng() : {lat:p.lat,lng:p.lon};
          return {lat:ll.lat,lon:(ll.lng ?? p.lon)};
        });
      if(!pts.length) return null;

      let best=null;
      for(const p of pts){
        const nearby=pts.filter(x=>kmDistance(p,x)<=1.0);
        const score=nearby.length;
        const avg={
          lat:nearby.reduce((s,x)=>s+x.lat,0)/nearby.length,
          lon:nearby.reduce((s,x)=>s+x.lon,0)/nearby.length
        };
        const spread=nearby.reduce((s,x)=>s+kmDistance(avg,x),0);
        if(!best || score>best.score || (score===best.score && spread<best.spread)){
          best={score,spread,lat:avg.lat,lon:avg.lon};
        }
      }
      return best;
    }

    function focusDistrict(district){
      const h=districtHotspot(district);
      if(!h) return;
      hideSheet();
      map.flyTo([h.lat,h.lon],15.5,{animate:true,duration:.75});
    }
    function refreshMarkers(){
      let count=0;
      places.forEach(p=>{
        const m=markers.get(p.name);
        if(!m) return;
        if(passes(p)){ if(!map.hasLayer(m)) m.addTo(map); count++; }
        else if(map.hasLayer(m)) map.removeLayer(m);
      });
      document.getElementById('countPill').textContent=`${count} mekan`;
    }

    function addMarkersInstantly(){
      const cache=readCache();
      const pts=[];
      for(const p of places){
        const saved=cache[p.name];
        const g=(saved && Number.isFinite(saved.lat) && Number.isFinite(saved.lon))
          ? saved
          : {lat:p.lat,lon:p.lon,display:p.q};
        geocoded.set(p.name,g);
        const m=L.marker([g.lat,g.lon],{icon:iconFor(p),title:p.name,riseOnHover:true});
        m.on('click',()=>showPlace(p));
        m.addTo(map);
        markers.set(p.name,m);
        pts.push([g.lat,g.lon]);
      }
      refreshMarkers();
      if(pts.length) map.fitBounds(pts,{padding:[60,60],maxZoom:13,animate:false});
    }

    // Precise geocoding is deliberately NOT on the critical rendering path.
    // The map is interactive immediately; exact coordinates are refreshed quietly,
    // one request at a time, then cached for future visits.
    async function refineLocationsInBackground(){
      const cache=readCache();
      const stale=places.filter(p=>!cache[p.name]);
      for(const p of stale){
        const g=await geocode(p.q);
        if(g){
          cache[p.name]=g;
          geocoded.set(p.name,g);
          const m=markers.get(p.name);
          if(m) m.setLatLng([g.lat,g.lon]);
          writeCache(cache);
        }
        await new Promise(r=>setTimeout(r,1050));
      }
    }

    function startBackgroundRefine(){
      const run=()=>refineLocationsInBackground();
      if('requestIdleCallback' in window) requestIdleCallback(run,{timeout:1800});
      else setTimeout(run,900);
    }

    addMarkersInstantly();
    startBackgroundRefine();

    document.getElementById('closeSheet').addEventListener('click',hideSheet);
    map.on('click',hideSheet);

    document.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        activeFilter=btn.dataset.filter;
        refreshMarkers();

        if(['beyoglu','besiktas','kadikoy'].includes(activeFilter)){
          focusDistrict(activeFilter);
        }else if(activeFilter==='all'){
          const visible=[];
          places.forEach(p=>{
            const m=markers.get(p.name);
            if(m && map.hasLayer(m)) visible.push(m.getLatLng());
          });
          if(visible.length) map.fitBounds(visible,{padding:[60,60],maxZoom:13,animate:true});
        }
      });
    });

    const topbar=document.getElementById('topbar');
    const filters=document.getElementById('filters');
    const searchbar=document.getElementById('searchbar');
    const searchInput=document.getElementById('searchInput');
    const results=document.getElementById('searchResults');

    function openSearch(){
      topbar.style.display='none'; filters.style.display='none';
      searchbar.classList.add('open'); results.classList.add('open'); searchInput.focus(); renderResults('');
    }
    function closeSearch(){
      topbar.style.display='flex'; filters.style.display='flex';
      searchbar.classList.remove('open'); results.classList.remove('open'); searchInput.value='';
    }
    function renderResults(term){
      term=term.trim().toLocaleLowerCase('tr');
      const arr=places.filter(p=>passes(p)&&(!term || (p.name+' '+p.deal).toLocaleLowerCase('tr').includes(term)));
      results.innerHTML=arr.slice(0,12).map(p=>`
        <button class="result" type="button" data-name="${p.name.replace(/"/g,'&quot;')}">
          <img src="${photos[p.pic]}" alt="" loading="lazy" decoding="async">
          <span><div class="rname">${p.name}</div><div class="rdeal">${p.deal}</div></span>
        </button>`).join('');
      results.querySelectorAll('.result').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const p=places.find(x=>x.name===btn.dataset.name);
          closeSearch();
          const m=markers.get(p.name);
          if(m) map.setView(m.getLatLng(),16,{animate:true});
          showPlace(p);
        });
      });
    }
    document.getElementById('searchBtn').addEventListener('click',openSearch);
    document.getElementById('cancelSearch').addEventListener('click',closeSearch);
    searchInput.addEventListener('input',()=>renderResults(searchInput.value));

  </script>
</body>
</html>
